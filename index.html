<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studying hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px;
            border-bottom: 3px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #4caf50;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        p {
            color: #aaa;
            font-size: 16px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4caf50;
        }
        .game-card h3 {
            margin: 10px 0 0 0;
            font-size: 18px;
        }
        .game-frame {
            width: 100%;
            height: 700px;
            border: 3px solid #333;
            border-radius: 8px;
            margin-top: 30px;
            display: none;
            background: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1> Welcome! This is a place for deep studying.</h1>
    </header>

    <div class="container">
        <h2>Study Hub</h2>
        <p>Click on something to study.</p>
        
        <div class="game-grid">
            <!-- This card now calls the checkPassword function instead of loading immediately -->
            <div class="game-card" onclick="checkPassword('https://ccported.github.io')">
                <h3>Relaxing music for studying</h3>
                <p>Click to listen.</p>
            </div>
        </div>

        <!-- The iframe game container -->
        <iframe id="game-workspace" class="game-frame" src=""></iframe>
    </div>

    <script>
        function checkPassword(url) {
            // Change '1234' inside the quotes to whatever password you want!
            var correctPassword = "3913"; 
            
            // This opens the pop-up box asking for the password
            var userGuess = prompt("Enter your deep study Password to continue:");
            
            if (userGuess === correctPassword) {
                // If the password is correct, load the game
                var frame = document.getElementById('game-workspace');
                frame.src = url;
                frame.style.display = 'block';
                frame.scrollIntoView({ behavior: 'smooth' });
            } else {
                // If the password is wrong, show an alert and do nothing
                alert("Get off my website!");
            }
        }
    </script>

</body>
</html>
