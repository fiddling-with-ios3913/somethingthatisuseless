<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Central Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px;
            border-bottom: 3px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #4caf50;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        p {
            color: #aaa;
            font-size: 16px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4caf50;
        }
        .game-card h3 {
            margin: 10px 0 0 0;
            font-size: 18px;
        }
        .game-frame {
            width: 100%;
            height: 700px;
            border: 3px solid #333;
            border-radius: 8px;
            margin-top: 30px;
            display: none;
            background: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Study Central Dashboard</h1>
    </header>

    <div class="container">
        <h2>Private Asset Hub</h2>
        <p>Click the card below to launch the community game server container directly into this page window.</p>
        
        <div class="game-grid">
            <!-- Clicking this card triggers the Javascript to open the games -->
            <div class="game-card" onclick="launchGame('https://github.io')">
                <h3>CCPorted Mirror</h3>
                <p>Click to load game catalog.</p>
            </div>
        </div>

        <!-- The iframe game container -->
        <iframe id="game-workspace" class="game-frame" src=""></iframe>
    </div>

    <script>
        function launchGame(url) {
            var frame = document.getElementById('game-workspace');
            frame.src = url;
            frame.style.display = 'block';
            // Smoothly scrolls your screen down to the game window
            frame.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
