<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Homework Workspace</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px;
            border-bottom: 3px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: #4caf50;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        p {
            color: #aaa;
            font-size: 16px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4caf50;
        }
        .game-card h3 {
            margin: 10px 0 0 0;
            font-size: 18px;
        }
        .game-frame {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Study Central Dashboard</h1>
    </header>

    <div class="container">
        <h2>Private Asset Hub</h2>
        <p>Select an external frame element to load games and app mirrors directly inside this page container.</p>
        
        <div class="game-grid">
            <!-- You can add your game link configurations right here -->
            <div class="game-card">
                <h3>CCPorted Mirror</h3>
                <p>Loads core game server assets.</p>
            </div>
        </div>

        <!-- This invisible workspace engine embeds the games safely inside your site -->
        <iframe id="game-workspace" class="game-frame" src=""></iframe>
    </div>

</body>
</html>
